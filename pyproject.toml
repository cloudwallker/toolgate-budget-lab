[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolgate-budget-lab"
version = "0.1.0"
description = "PostgreSQL-backed atomic budgets for agent tool calls"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate", "src/mock_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
